# Copy outside the public repository. No credentials in this file.
[server]
listen = "0.0.0.0:8790"
data_dir = "/data"
language = "fr"
timezone = "Europe/Paris"
worker_threads = 2
history_days = 30
allowed_hosts = ["moli.example.org"]

[guard]
dashboard = "pin"
protect_unassigned = true

